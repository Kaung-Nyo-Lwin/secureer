name: Application checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py collectstatic --noinput
      - run: python manage.py test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t secureer:test .
      - run: |
          docker run -d --name secureer -p 8000:8000 \
            -e DJANGO_DEBUG=False \
            -e DJANGO_SECRET_KEY=ci-only-not-a-deployment-secret-key-for-secureer-testing \
            secureer:test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8000/health/; then
              curl --fail http://127.0.0.1:8000/example/ > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs secureer
          exit 1
