services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "False"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-local-compose-only-change-before-public-deployment-secureer}"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
      SECUREER_ENGINE: demo
    volumes:
      - secureer-data:/app/var
    restart: unless-stopped

volumes:
  secureer-data:
